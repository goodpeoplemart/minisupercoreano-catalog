# Render Blueprint — minisupercoreano-catalog
# Set secret env vars in the Render Dashboard (never commit real values).
#
# SQLite stores Shopify sessions only. Mount a persistent disk so sessions
# survive redeploys. Without a disk, merchants must re-authenticate after each deploy.

services:
  - type: web
    name: minisupercoreano-catalog
    runtime: node
    plan: starter
    buildCommand: npm install && npm run setup && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/production.sqlite
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_products,write_products,write_app_proxy
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_EMAIL_FROM
        sync: false
      - key: ORDER_EMAIL_TO
        sync: false
    disk:
      name: msc-sqlite-data
      mountPath: /data
      sizeGB: 1
